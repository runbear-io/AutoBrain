[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autobrain"
version = "0.1.1"
description = "Local company-brain comparator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14.0a0"
dependencies = [
  "authlib>=1.6,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "keyring>=25.6,<26",
  "mcp>=1.12,<2",
  "mem0ai==2.0.18",
  "openai>=1.90,<2",
  "packaging>=24,<27",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
  "textual>=1,<8",
]

[project.scripts]
autobrain = "autobrain.bootstrap:main"
autobrain-generate-formula = "autobrain.release_formula:generate_main"
autobrain-verify-formula = "autobrain.release_formula:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autobrain"]

[tool.hatch.build.targets.sdist]
include = [
  "src/autobrain/**",
  "tests/**",
  "docs/**",
  "README.md",
  "DESIGN.md",
  "pyproject.toml",
  "uv.lock",
  "schemas/fixture-v1.json",
]
exclude = [
  ".omo/**",
  "web/**",
  ".senpi/task-10-final-qa-20260818/**",
  ".senpi/task9-final-qa-20260818/**",
  ".senpi/task9-qa-20260818/**",
  ".senpi/task10-browser-fixture/**",
]

[tool.hatch.build.targets.sdist.force-include]
".senpi/task-10-final-qa/comparison.json" = ".senpi/task-10-final-qa/comparison.json"
".senpi/task-10-final-qa/manifest.json" = ".senpi/task-10-final-qa/manifest.json"
".senpi/task-10-final-qa/screenshots/report-1280.png" = ".senpi/task-10-final-qa/screenshots/report-1280.png"
".senpi/task-10-final-qa/screenshots/report-375.png" = ".senpi/task-10-final-qa/screenshots/report-375.png"
".senpi/task-10-final-qa/screenshots/report-768.png" = ".senpi/task-10-final-qa/screenshots/report-768.png"
".senpi/task-10-final-qa/task-10-final-qa.txt" = ".senpi/task-10-final-qa/task-10-final-qa.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires an explicitly configured and authorized provider runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
